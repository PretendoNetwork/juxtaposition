name: "juxtaposition-dev"

services:
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  postgres:
    image: postgres:18
    restart: unless-stopped
    command: "-c log_statement=all"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "postgres"
    volumes:
      - "db_data:/var/lib/postgresql"
      - ./create-dbs.sql:/docker-entrypoint-initdb.d/init.sql
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    environment:
      # https://jira.mongodb.org/browse/SERVER-121912
      - GLIBC_TUNABLES=glibc.pthread.rseq=1
    ports:
      - 27017:27017
    extra_hosts:
      - "host.docker.internal:host-gateway"

    # This funky stuff is needed for making a replicaset
    healthcheck:
      test: echo "try { rs.status() } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'host.docker.internal:27017'}]}) }" | mongosh --port 27017 --quiet
      interval: 5s
      timeout: 30s
      start_period: 0s
      start_interval: 1s
      retries: 30
    volumes:
      - "mongo_data:/data/db"
      - "mongo_config:/data/configdb"
  garage:
    image: dxflrs/garage:v2.3.0
    restart: unless-stopped
    networks: [net]
    ports:
      - "3900:3900"
      - "3902:3902"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ./assets/garage.toml:/etc/garage.toml:ro
      - garage_data:/var/lib/garage
  garage-init:
    image: alpine:3.23
    depends_on:
      garage:
        condition: service_healthy
    network_mode: service:garage
    pid: service:garage
    environment:
      GARAGE_ADMIN_TOKEN: garage-admin-token
      S3_ACCESS_KEY_NAME: juxt-key
      S3_ACCESS_KEY_ID: GK3515373e4c851ebaad366558
      S3_ACCESS_KEY_SECRET: 7d37d093435a41f2aab8f13c19ba067d9776c90215f56614adad6ece597dbb34
      S3_BUCKET: miiverse
    restart: "on-failure:2"
    entrypoint: "/bin/sh -eu /etc/init.sh"
    volumes:
      - "./assets/garage-init.sh:/etc/init.sh"

  proxy:
    # 12.2.3 has some OpenSSL error when using old TLS versions
    image: mitmproxy/mitmproxy:12.2.2
    command: > 
      mitmweb -v --mode regular@8888
      -s /data/mitmproxy-local.py
      --web-host 0.0.0.0 --set web_password=letmein
      -k --set tls_version_client_min=TLS1 --set tls_version_server_min=TLS1
      --set key_size=1024
    ports:
      - 8888:8888
      - 127.0.0.1:8081:8081
    volumes:
      - "./mitmproxy-local.py:/data/mitmproxy-local.py"
      - "./mitmproxy-data/:/home/mitmproxy/.mitmproxy/"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  account:
    image: ghcr.io/pretendonetwork/account:sha-fc12061
    restart: unless-stopped
    ports:
      - "8123:8123" # grpc
    links:
      - mongo
    environment:
      PN_ACT_CONFIG_REDIS_URL: redis://redis:6379
      PN_ACT_CONFIG_HTTP_PORT: 8000
      PN_ACT_CONFIG_GRPC_PORT: 8123
      PN_ACT_CONFIG_MONGO_CONNECTION_STRING: "mongodb://mongo:27017/account?directConnection=true"
      PN_ACT_CONFIG_S3_ENDPOINT: "http://minio:9000"
      PN_ACT_CONFIG_S3_REGION: "us-east-1"
      PN_ACT_CONFIG_S3_BUCKET: "miiverse"
      PN_ACT_CONFIG_S3_ACCESS_KEY: "minioadmin"
      PN_ACT_CONFIG_S3_ACCESS_SECRET: "minioadmin"
      PN_ACT_CONFIG_CDN_BASE_URL: "http://cdn.pretendo.cc/miiverse"
      PN_ACT_CONFIG_AES_KEY: "1234567812345678123456781234567812345678123456781234567812345678"
      PN_ACT_CONFIG_GRPC_MASTER_API_KEY_ACCOUNT: "12345678123456781234567812345678"
      PN_ACT_CONFIG_GRPC_MASTER_API_KEY_API: "12345678123456781234567812345678"

  friends: # Newer versions of friends require dumping decryption keys. We're using an old version to keep local hosting easy
    image: ghcr.io/pretendonetwork/friends:sha-5560c1d
    restart: unless-stopped
    ports:
      - "8124:8124" # grpc
    environment:
      PN_FRIENDS_CONFIG_DATABASE_URI: "postgres://postgres:postgres@postgres:5432/friends?sslmode=disable"
      PN_FRIENDS_CONFIG_AES_KEY: "1234567812345678123456781234567812345678123456781234567812345678"
      PN_FRIENDS_CONFIG_GRPC_API_KEY: "12345678123456781234567812345678"
      PN_FRIENDS_GRPC_SERVER_PORT: 8124
      PN_FRIENDS_AUTHENTICATION_SERVER_PORT: 60000
      PN_FRIENDS_SECURE_SERVER_HOST: "friends"
      PN_FRIENDS_SECURE_SERVER_PORT: 60001
      PN_FRIENDS_ACCOUNT_GRPC_HOST: "account"
      PN_FRIENDS_ACCOUNT_GRPC_PORT: 8123
      PN_FRIENDS_ACCOUNT_GRPC_API_KEY: "12345678123456781234567812345678"

networks:
  net:

volumes:
  mongo_data:
  mongo_config:
  redis_data:
  garage_data:
  db_data:
